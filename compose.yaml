services:
  corpus:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4173
      HOST: 0.0.0.0
      BOOKMARK_SOURCE: /data/ft-bookmarks/bookmarks.jsonl
      BOOKMARK_DB: /data/ft-bookmarks/bookmarks.db
      X_COOKIE_ENV: /run/secrets/x.env
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ${FT_BOOKMARKS_DIR:-~/.ft-bookmarks}:/data/ft-bookmarks:ro
      - ./data:/data/corpus
      # CT0= / AUTH_TOKEN= for read-only thread unrolling (the session your FieldTheory sync uses)
      - ${X_COOKIE_FILE:-./x-cookies.env}:/run/secrets/x.env:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      corpus:
        condition: service_healthy
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./.cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./.cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
