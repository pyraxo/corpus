<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Corpus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e1e1e'/%3E%3Ccircle cx='23' cy='9' r='3' fill='%23f386a1'/%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Corpus" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="application-name" content="Corpus" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&family=Instrument+Serif&display=swap" />
  <link rel="stylesheet" href="/styles.css?v=20" />
  <style>
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .gate form { width: min(320px, 100%); display: grid; gap: 14px; }
    .gate .wordmark { font-size: 44px; justify-self: center; margin-bottom: 18px; }
    .gate .field { height: 40px; width: 100%; font-size: 15px; }
    .gate .primary { height: 40px; justify-content: center; font-size: 14px; }
    .gate .err { min-height: 18px; margin: 0; font: 12px var(--mono); color: var(--accent-ink); text-align: center; }
  </style>
</head>
<body>
  <main class="gate">
    <form id="gate">
      <span class="wordmark">corpus</span>
      <input class="field" id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required />
      <button class="primary" type="submit">Enter</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    document.getElementById('gate').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const res = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      if (res.ok) { location.replace(location.pathname === '/login' ? '/' : location.pathname + location.search); return; }
      err.textContent = (await res.json().catch(() => ({}))).error || 'Could not sign in';
      document.getElementById('pw').select();
    });
  </script>
</body>
</html>
